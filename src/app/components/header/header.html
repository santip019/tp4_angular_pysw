<header>
    <nav class="navbar navbar-expand-lg" aria-label="Navegación principal" bg-body-tertiary>
        <div class="container">
            <!-- Logo de la agencia -->
            <a routerLink="/home" class="navbar-brand">Waldos Store</a>

            <!-- Botón toggle para dispositivos móviles -->
            <button class="navbar-toggler border-0 shadow-none px-2" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarPrincipal" aria-controls="navbarPrincipal" aria-expanded="false"
                aria-label="Toggle navigation">
                <div class="custom-toggler">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </button>

            <!-- Opciones del menú principal-->
            <div class="collapse navbar-collapse" id="navbarPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">Categorias</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" (click)="filtroService.setCategoria('Celulares')">Celulares</a></li>
                            <li><a class="dropdown-item" (click)="filtroService.setCategoria('Computadoras')">Computadoras</a></li>
                            <li><a class="dropdown-item" (click)="filtroService.setCategoria('Accesorios')">Accesorios</a></li>
                            <li><a class="dropdown-item" (click)="filtroService.setCategoria('Tablets')">Tablets</a></li>
                            <li><a class="dropdown-item" (click)="filtroService.setCategoria('Televisores')">Televisores</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" (click)="filtroService.setCategoria('')">Todos</a></li>
                        </ul>
                    </li>

                </ul>

                <!-- Botón para alternar el modo oscuro -->
                <div class="d-flex align-items-center">
                    <button (click)="toggleDarkMode()"
                        class="btn btn-outline-secondary border-0 p-2 d-flex align-items-center justify-content-center rounded-circle dark-mode-btn"
                        type="button" aria-label="Alternar modo oscuro">
                        <i [class]="isDarkMode ? 'bi bi-sun' : 'bi bi-moon'"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>
</header>
