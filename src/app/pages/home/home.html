<main class="container my-5">
    <div class="section-title text-center mb-4">
        <h1>Lista de Productos</h1>
        <p>Tecnologia de punta</p>
    </div>  

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col" *ngFor="let producto of productosFiltrados()">
            <div class="card h-100 producto-card shadow-sm">
                <div class="card-img-container bg-light d-flex align-items-center justify-content-center" style="height: 180px;">
                    <img [src]="producto.img" class="card-img-top w-100 h-100 object-fit-contain" [alt]="producto.nombre">
                </div>
                
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-primary">{{ producto.nombre }}</h5>
                    <p class="card-text flex-grow-1 text-muted small">{{ producto.descripcion }}</p>
                    <div class="mt-auto pt-3 d-flex justify-content-between align-items-center">
                        <span class="mb-0 fw-bold text-dark card-span">{{ producto.precio | currency:'ARS ' }}</span>
                        <button class="btn btn-outline-success btn-sm d-flex align-items-center gap-2 px-3">
                            <i class="bi bi-cart3"></i> Carrito
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
